<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D-STAR Live Activity</title>
  <style>
    :root {
      --bg:       #0d1117;
      --surface:  #161b22;
      --border:   #30363d;
      --text:     #e6edf3;
      --muted:    #8b949e;
      --green:    #3fb950;
      --yellow:   #e3b341;
      --orange:   #f0883e;
      --red:      #f85149;
      /* Protocol colours */
      --c-REF:    #388bfd;
      --c-XLX:    #3fb950;
      --c-DCS:    #e3b341;
      --c-XRF:    #bc8cff;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
      min-height: 100vh;
      padding: 20px 16px 40px;
      max-width: 900px;
      margin: 0 auto;
    }

    /* ── Header ─────────────────────────────────────────────────────────── */
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--text);
    }
    .title span { color: var(--green); }

    .meta {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 0.72rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .live-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: pulse 2s infinite;
    }
    .dot.error  { background: var(--red);    box-shadow: 0 0 6px var(--red);    animation: none; }
    .dot.stale  { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); animation: none; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    /* ── Table ──────────────────────────────────────────────────────────── */
    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    thead th {
      padding: 6px 14px;
      text-align: left;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    thead th.center { text-align: center; }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.12s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface); }

    td {
      padding: 11px 14px;
      vertical-align: middle;
    }

    .td-rank {
      color: var(--muted);
      font-size: 0.72rem;
      width: 30px;
      text-align: right;
    }

    /* Protocol badge */
    .badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }
    .badge-REF { color: var(--c-REF); background: rgba(56,139,253,.13); border: 1px solid rgba(56,139,253,.4); }
    .badge-XLX { color: var(--c-XLX); background: rgba(63,185,80,.13);  border: 1px solid rgba(63,185,80,.4);  }
    .badge-DCS { color: var(--c-DCS); background: rgba(227,179,65,.13); border: 1px solid rgba(227,179,65,.4); }
    .badge-XRF { color: var(--c-XRF); background: rgba(188,140,255,.13);border: 1px solid rgba(188,140,255,.4);}

    .td-id { font-weight: 600; letter-spacing: 0.04em; }

    .module-circle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px; height: 22px;
      border-radius: 50%;
      border: 1px solid var(--border);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
    }

    .td-call { font-weight: 500; letter-spacing: 0.03em; }
    .td-call a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px dotted var(--border);
    }
    .td-call a:hover { border-bottom-color: var(--muted); color: var(--text); }

    .td-time { white-space: nowrap; font-size: 0.78rem; }
    .fresh  { color: var(--green); }
    .recent { color: var(--yellow); }
    .old    { color: var(--orange); }
    .stale  { color: var(--red); }

    /* ── Empty / loading / error states ─────────────────────────────────── */
    .state-box {
      padding: 60px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .state-box.err { color: var(--red); }

    /* ── Footer ─────────────────────────────────────────────────────────── */
    footer {
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      color: var(--muted);
      flex-wrap: wrap;
      gap: 6px;
    }

    .source-pills { display: flex; gap: 8px; flex-wrap: wrap; }
    .source-pill {
      padding: 2px 8px;
      border-radius: 3px;
      border: 1px solid var(--border);
      font-size: 0.65rem;
    }
    .source-pill.ok    { border-color: rgba(63,185,80,.4);  color: var(--green); }
    .source-pill.error { border-color: rgba(248,81,73,.4);  color: var(--red); }
    .source-pill.pending { color: var(--muted); }

    /* ── On-air net label ───────────────────────────────────────────────── */
    .net-label {
      display: block;
      font-size: 0.60rem;
      color: var(--green);
      letter-spacing: 0.03em;
      margin-top: 3px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 120px;
    }

    /* ── Refresh button ─────────────────────────────────────────────────── */
    .refresh-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 3px 10px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      cursor: pointer;
      white-space: nowrap;
    }
    .refresh-btn:hover:not(:disabled) { border-color: var(--muted); color: var(--text); }
    .refresh-btn:disabled { opacity: 0.45; cursor: default; }

    /* ── Responsive ──────────────────────────────────────────────────────── */
    @media (max-width: 560px) {
      .hide-mobile { display: none; }
    }
  </style>
</head>
<body>

  <header>
    <div class="title">D-STAR <span>LIVE</span> &nbsp;·&nbsp; Reflector Activity</div>
    <div class="meta">
      <span class="live-indicator">
        <span class="dot" id="dot"></span>
        <span id="updated">—</span>
      </span>
      <button class="refresh-btn" id="refresh-btn" title="Click to refresh now">↺ <span id="countdown">30</span>s</button>
    </div>
  </header>

  <div class="table-wrap" id="content">
    <div class="state-box">Loading reflector activity…</div>
  </div>

  <footer>
    <div class="source-pills" id="source-pills"></div>
    <span id="foot-right"></span>
  </footer>

  <script>
    const API   = '/api/reflectors';
    const EVERY = 30; // seconds between refreshes

    let timer, countdown;
    let lastData = null;

    // ── Time helpers ────────────────────────────────────────────────────────

    function secsAgo(iso) {
      return Math.max(0, Math.floor((Date.now() - new Date(iso)) / 1000));
    }

    function fmtAgo(s) {
      if (s <  60)   return `${s}s ago`;
      if (s < 3600)  return `${Math.floor(s / 60)}m ${s % 60}s ago`;
      return `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m ago`;
    }

    function agoClass(s) {
      if (s <  300) return 'fresh';
      if (s <  900) return 'recent';
      if (s < 1800) return 'old';
      return 'stale';
    }

    // ── Scheduled nets ──────────────────────────────────────────────────────
    // Times are US Eastern (EDT = UTC-4 summer / EST = UTC-5 winter).
    // day: 0=Sun 1=Mon 2=Tue 3=Wed 4=Thu 5=Fri 6=Sat
    // [day, hour, minute, 'Net Name', 'ReflectorID', 'Module']
    const SCHEDULE = [
      // SATURDAY
      [6,  8,  0, 'SCARS Full Net / AM Connection',        'XLX073','J'],
      [6,  9,  0, '6 Alpha D-STAR Net',                    'REF006','A'],
      [6,  9, 30, 'National Capitol Region Net',            'REF016','B'],
      [6, 12,  0, 'SOUTHCARS Intercontinental Net',        'XLX073','J'],
      [6, 13,  0, 'Italian Language Net',                  'REF007','A'],
      [6, 19,  0, 'SCARS Open Ragchew',                    'XLX073','J'],
      [6, 20,  0, 'D-STAR HF Net',                         'REF030','C'],
      [6, 20,  0, 'Young Operators Digital Voice Net',     'XRF757','A'],
      [6, 20, 30, 'Coastal Carolinas D-STAR Net',          'REF061','C'],
      [6, 20, 30, 'Mid-Atlantic States D-RATS',            'REF062','D'],
      [6, 21,  0, 'Arizona D-STAR Net',                    'REF009','C'],
      [6, 21,  0, 'D-STAR Users Group',                   'XRF002','A'],
      [6, 21,  0, 'International D-STAR Net',              'REF091','C'],
      [6, 21,  0, 'Ohio State-Wide D-STAR Net',            'XRF038','A'],
      [6, 21,  0, 'Saturday Evening D-Star Net',           'REF024','A'],
      [6, 21, 30, 'Minnesota D-STAR Net',                  'REF053','A'],
      [6, 21, 30, 'South Counties Emergency Repeater Net', 'REF020','B'],
      [6, 23,  0, 'FWARC D-STAR Net',                     'REF035','C'],
      [6, 23,  0, 'Northern Utah Technical Society',       'REF029','C'],
      [6, 23,  0, 'Saturday Night D-STAR Net',             'REF029','A'],
      [6, 23,  0, 'Wisconsin D-STAR Net',                  'REF019','B'],
      // SUNDAY
      [0,  0,  0, 'BC to SF Net',                          'REF014','A'],
      [0, 11,  0, 'D-STAR HF Net',                         'REF030','C'],
      [0, 14,  0, 'Military Veteran Net',                  'REF026','A'],
      [0, 16,  0, 'Hungarian Language Net',                'REF042','C'],
      [0, 19,  0, 'Sunday Round Table Net',                'REF006','A'],
      [0, 19,  0, 'SCARS Open Ragchew',                    'XLX073','J'],
      // MONDAY
      [1, 20, 30, 'RACES/MARC Digital Voice Net',          'XLX307','D'],
      [1, 21,  0, 'D-Star Net',                            'REF020','A'],
      [1, 21,  0, 'Northern Ontario D-STAR Net',           'XRF103','B'],
      [1, 22,  0, 'North Carolina D-Star Net',             'REF054','A'],
      // TUESDAY
      [2, 20, 30, 'Free Mason D-Star Net',                 'REF038','A'],
      [2, 20, 30, 'Region III Auxiliary Comms Service',    'REF062','B'],
      [2, 21,  0, '100 Watts & a Wire D-STAR',             'XRF002','A'],
      [2, 21,  0, 'New England Amateur D-STAR Net',        'REF069','C'],
      [2, 21,  0, 'Powersports Net',                       'XRF555','A'],
      [2, 21, 30, 'Ark-La-Tex D-STAR Net',                 'REF048','B'],
      [2, 21, 30, 'Treasure Coast DART Group',             'REF078','C'],
      [2, 21, 30, 'Tri-State Amateur D-STAR Net',          'REF001','C'],
      [2, 22,  0, 'North Carolina D-STAR Net',             'REF054','C'],
      [2, 22,  0, 'Texas D-STAR Net',                      'REF004','B'],
      [2, 22, 30, 'Alabama D-STAR Net',                    'REF058','B'],
      [2, 23,  0, 'Colorado D-STAR Net',                   'REF035','B'],
      [2, 23,  0, 'D-STAR Net of SE Louisiana',            'REF048','C'],
      // WEDNESDAY
      [3,  0,  0, 'PAPA System D-Star Net',                'REF012','A'],
      [3, 21,  0, 'Backyard Repeater Owners / SE Michigan','REF089','C'],
      [3, 21,  0, 'Mid-Atlantic Auxiliary Comms Service',  'REF062','A'],
      [3, 21,  0, 'Wisconsin D-STAR Net',                  'REF019','B'],
      [3, 22,  0, 'Florida State-Wide D-STAR DV Net',      'REF004','B'],
      [3, 22,  0, 'National Capital Region Net (DC)',      'REF062','A'],
      [3, 22,  0, 'Worldwide DVAP Net',                    'REF014','C'],
      [3, 22, 30, 'Illinois Digital Net',                  'XRF334','G'],
      [3, 23,  0, 'Ham Nation After Show D-STAR Net',      'REF014','C'],
      [3, 23,  0, 'Illinois State D-STAR Net',             'REF051','D'],
      // THURSDAY
      [4,  0,  0, 'Puget Sound D-STAR Social Net',         'REF035','C'],
      [4, 19,  0, 'SCARS Thursday Information Net',        'XLX073','J'],
      [4, 20,  0, 'Kentucky D-STAR Net',                   'REF056','B'],
      [4, 21,  0, 'Indiana State D-STAR Net',              'REF024','B'],
      [4, 22,  0, 'Florida D-STAR Net',                    'REF037','C'],
      [4, 22, 30, 'Pacific Division D-Star ARES Net',      'XRF014','B'],
      [4, 22, 30, 'Round-the-World QSO Net',               'XRF038','D'],
      [4, 23,  0, 'CERT DSTAR Net',                        'REF058','A'],
      [4, 23,  0, 'Nebraska D-Star Net',                   'REF002','C'],
      [4, 23,  0, 'New Mexico D-STAR Net',                 'REF055','A'],
      [4, 23,  0, 'Thursday Night D-STAR Round Table',     'XRF002','A'],
      [4, 23,  0, 'W6DHS Global Village Net',              'REF001','C'],
      // FRIDAY
      [5,  7,  0, 'Australian D-Star Net',                 'REF003','C'],
      [5,  9, 30, 'Georgia Public Health Net',             'REF030','B'],
      [5, 15, 30, 'Dutch Net',                             'XRF008','B'],
      [5, 21,  0, 'D-STAR Trains and Railroads Net',       'REF026','A'],
      [5, 22,  0, 'Canadian D-STAR Net',                   'XRF103','B'],
      [5, 22,  0, 'Kids in Amateur Radio',                 'REF012','C'],
      [5, 22, 30, 'Memphis Digital ARC Net',               'REF058','A'],
    ];

    // Return Map<"REF030-C", "Net Name"> for nets currently on air (±30 min, Eastern time).
    function getActiveNets() {
      const month = new Date().getUTCMonth(); // 0-based
      const etOff = (month >= 2 && month <= 10) ? -4 : -5; // EDT or EST
      const etMs  = Date.now() + etOff * 3600000;
      const et    = new Date(etMs);
      // Minutes since Sunday midnight ET — used for week-spanning comparison
      const nowWeekMins = et.getUTCDay() * 1440 + et.getUTCHours() * 60 + et.getUTCMinutes();
      const WEEK  = 7 * 1440;
      const WIN   = 30; // ± minutes
      const result = new Map();
      for (const [day, h, m, name, ref, mod] of SCHEDULE) {
        const netWeekMins = day * 1440 + h * 60 + m;
        let diff = Math.abs(nowWeekMins - netWeekMins);
        if (diff > WEEK / 2) diff = WEEK - diff; // week wraparound (Sat night → Sun)
        if (diff <= WIN) result.set(`${ref}-${mod}`, name);
      }
      return result;
    }

    // ── Source pill text ────────────────────────────────────────────────────

    function fmtPill(v) {
      if (v.status === 'error') return `✗ ${v.message || 'error'}`;
      if (v.status !== 'ok')   return 'pending';
      // REF / env-configured reflectors report a flat entry count
      if (v.entries !== undefined) return `✓ ${v.entries} entries`;
      // XLX API reports active count + responded + optional age
      if (v.active !== undefined) {
        let t = `✓ ${v.active} online · ${v.responded ?? 0} active`;
        if (v.newestMinsAgo != null && v.newestMinsAgo >= 0) {
          const m = v.newestMinsAgo;
          t += ` · last ${m < 60 ? `${m}m` : `${Math.floor(m/60)}h ${m%60}m`} ago`;
        }
        return t;
      }
      return '✓';
    }

    // ── Render ──────────────────────────────────────────────────────────────

    function renderTable(data) {
      lastData = data;
      const { reflectors = [], sources = {}, updatedAt } = data;

      // Header status
      const dot = document.getElementById('dot');
      const upd = document.getElementById('updated');
      if (updatedAt) {
        dot.className = 'dot';
        upd.textContent = new Date(updatedAt).toUTCString().slice(17, 25) + ' UTC';
      }

      // Source pills
      const pills = document.getElementById('source-pills');
      pills.innerHTML = Object.entries(sources).map(([k, v]) =>
        `<span class="source-pill ${v.status}">${k.toUpperCase()} ${fmtPill(v)}</span>`
      ).join('');

      if (!reflectors.length) {
        document.getElementById('content').innerHTML =
          '<div class="state-box">No reflector activity in the last 30 minutes.</div>';
        document.getElementById('foot-right').textContent = '';
        return;
      }

      const activeNets = getActiveNets();
      const rows = reflectors.map(r => {
        const s       = secsAgo(r.lastHeardAt);
        const cls     = agoClass(s);
        const call    = r.lastCallsign !== '—'
          ? `<a href="https://www.qrz.com/db/${r.lastCallsign}" target="_blank" rel="noopener noreferrer">${r.lastCallsign}</a>`
          : '—';
        const netName = activeNets.get(`${r.id}-${r.module}`);
        const netLabel = netName ? `<span class="net-label">● ${netName}</span>` : '';
        return `
          <tr>
            <td class="td-rank">${r.rank}</td>
            <td><span class="badge badge-${r.protocol}">${r.protocol}</span></td>
            <td class="td-id">${r.id}${netLabel}</td>
            <td style="text-align:center"><span class="module-circle">${r.module}</span></td>
            <td class="td-call hide-mobile">${call}</td>
            <td class="td-time ${cls}">${fmtAgo(s)}</td>
          </tr>`;
      }).join('');

      document.getElementById('content').innerHTML = `
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Protocol</th>
              <th>Reflector</th>
              <th class="center">Mod</th>
              <th class="hide-mobile">Last Callsign</th>
              <th>Heard</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>`;

      document.getElementById('foot-right').textContent =
        `Showing ${reflectors.length} of ${reflectors.length} most-recent reflectors`;
    }

    // Live-update time cells and net labels every second without a full re-render
    function tickTimes() {
      if (!lastData) return;
      const activeNets = getActiveNets();
      document.querySelectorAll('tbody tr').forEach((tr, i) => {
        const r = lastData.reflectors[i];
        if (!r) return;

        const tdTime = tr.querySelector('.td-time');
        const s = secsAgo(r.lastHeardAt);
        tdTime.textContent = fmtAgo(s);
        tdTime.className   = `td-time ${agoClass(s)}`;

        // Add or remove on-air net label in real time
        const tdId   = tr.querySelector('.td-id');
        const netName = activeNets.get(`${r.id}-${r.module}`);
        let   label  = tdId.querySelector('.net-label');
        if (netName) {
          if (!label) { label = document.createElement('span'); label.className = 'net-label'; tdId.appendChild(label); }
          label.textContent = `● ${netName}`;
        } else if (label) {
          label.remove();
        }
      });
    }

    // ── Fetch ───────────────────────────────────────────────────────────────

    async function refresh() {
      try {
        const res = await fetch(API);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        renderTable(await res.json());
      } catch (err) {
        document.getElementById('dot').className = 'dot error';
        document.getElementById('updated').textContent = 'fetch failed';
        console.error(err);
      }
    }

    function startCountdown() {
      clearInterval(timer);
      countdown = EVERY;
      document.getElementById('countdown').textContent = countdown;
      document.getElementById('refresh-btn').disabled = false;

      timer = setInterval(() => {
        countdown--;
        document.getElementById('countdown').textContent = Math.max(0, countdown);
        tickTimes();
        if (countdown <= 0) {
          clearInterval(timer);
          refresh().then(startCountdown);
        }
      }, 1000);
    }

    document.getElementById('refresh-btn').addEventListener('click', () => {
      const btn = document.getElementById('refresh-btn');
      if (btn.disabled) return;
      btn.disabled = true;
      clearInterval(timer);
      document.getElementById('countdown').textContent = '…';
      refresh().then(startCountdown);
    });

    refresh().then(startCountdown);
  </script>
</body>
</html>
